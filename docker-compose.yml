version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: npc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-npc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-npc_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-npc_fixitcenter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npc_user} -d ${POSTGRES_DB:-npc_fixitcenter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: npc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: npc_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-npc_user}:${POSTGRES_PASSWORD:-npc_secret_2024}@postgres:5432/${POSTGRES_DB:-npc_fixitcenter}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret_2024}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_prod}
      - AES_KEY=${AES_KEY:-0123456789abcdef0123456789abcdef}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: npc_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_WS_URL=ws://api:3001
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
